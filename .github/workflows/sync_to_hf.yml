name: Sync to Hugging Face Space

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face Hub CLI
        run: pip install --upgrade "huggingface_hub[cli]"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          python3 - << 'EOF'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          target = os.environ.get("HF_SPACE_REPO") or "Shaan1209/skyris-models"
          target = target.strip()
          
          print(f"Syncing repository to Hugging Face Space: {target}")
          api = HfApi(token=token)
          api.upload_folder(
              folder_path=".",
              repo_id=target,
              repo_type="space",
              ignore_patterns=[".git*", ".github*", "__pycache__*", "*.pyc"],
          )
          print("Successfully uploaded to Hugging Face Space!")
          EOF
