name: Sync to Hugging Face Space

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config lfs.allowincompletepush true
          HF_TARGET="${{ secrets.HF_SPACE_REPO }}"
          if [ -z "$HF_TARGET" ]; then
            HF_TARGET="Shaan1209/skyris-models"
          fi
          echo "Syncing to https://huggingface.co/spaces/$HF_TARGET"
          git push --force https://PrakharSinghOnGit:$HF_TOKEN@huggingface.co/spaces/$HF_TARGET HEAD:refs/heads/main
